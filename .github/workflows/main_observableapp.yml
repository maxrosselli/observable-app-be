name: Build and deploy ASP.Net Core app to Azure Web App - observableapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout del codice
      - uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dei pacchetti NuGet
      - name: Restore dependencies
        run: dotnet restore

      # 4️⃣ Build del progetto
      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

      # 5️⃣ Publish del progetto
      - name: Publish app
        run: dotnet publish -c Release -o ./publish-output --no-build

      # 6️⃣ Carica l’artifact per il deploy
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: net-app
          path: ./publish-output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Scarica l’artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: net-app
          path: ./publish-output

      # 2️⃣ Login ad Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3️⃣ Deploy su Azure Web App Linux
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'observableapp-fxbcaqekc9bqb4hm'   # Nome esatto della Web App
          resource-group: 'MonitoringPOC'               # Resource Group corretto
          package: ./publish-output
